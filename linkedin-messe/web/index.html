<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b3d75">
  <meta name="robots" content="noindex, nofollow">
  <title>Messe-Poster</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="stylesheet" href="assets/vendor/cropper.min.css">
  <link rel="stylesheet" href="assets/styles.css">
</head>
<body>
  <header class="topbar">
    <a href="#/" class="brand">Messe-Poster</a>
    <span id="net" class="net" hidden>offline</span>
    <nav id="nav" hidden>
      <a href="#/templates" title="Vorlagen">Vorlagen</a>
      <a href="oauth.php?logout=1" title="Abmelden" id="logout">Abmelden</a>
    </nav>
  </header>
  <div id="banner" class="banner" hidden></div>
  <main id="view" class="view"><p class="muted center">Lade …</p></main>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <dialog id="cropDialog" class="crop-dialog">
    <div class="crop-stage"><img id="cropImg" alt=""></div>
    <div class="crop-tools">
      <div class="seg" id="aspects">
        <button type="button" data-aspect="NaN" class="on">Frei</button>
        <button type="button" data-aspect="1">1:1</button>
        <button type="button" data-aspect="0.8">4:5</button>
        <button type="button" data-aspect="1.91">Quer</button>
      </div>
      <div class="row">
        <button type="button" class="btn ghost" data-rotate="-90" aria-label="Links drehen">⟲ 90°</button>
        <button type="button" class="btn ghost" data-rotate="90" aria-label="Rechts drehen">⟳ 90°</button>
        <button type="button" class="btn ghost" id="cropReset">Zurücksetzen</button>
      </div>
      <div class="row">
        <button type="button" class="btn ghost" id="cropCancel">Abbrechen</button>
        <button type="button" class="btn primary" id="cropOk">Übernehmen</button>
      </div>
    </div>
  </dialog>

  <script src="assets/vendor/cropper.min.js"></script>
  <script src="assets/vendor/Sortable.min.js"></script>
  <script type="module" src="assets/app.js"></script>
</body>
</html>
